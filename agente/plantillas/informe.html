<!doctype html>
<!-- Plantilla base de informe. El agente la copia, completa los {{campos}} y las secciones, y la pasa a PDF con
     chromium --headless --no-sandbox --print-to-pdf=<salida>/informe.pdf informe.html -->
<html lang="es"><head><meta charset="utf-8"><title>{{titulo}}</title>
<style>
  @page { size: A4; margin: 20mm 18mm; }
  body { font-family: "DejaVu Sans", "Liberation Sans", sans-serif; color: #1c1917; font-size: 11pt; line-height: 1.5; }
  h1 { font-size: 22pt; margin: 0 0 4px; } .sub { color: #78716c; margin: 0 0 18px; }
  h2 { font-size: 13pt; color: #047857; border-bottom: 1px solid #d6d3d1; padding-bottom: 3px; margin-top: 22px; }
  .resumen { background: #f5f5f4; border-left: 4px solid #047857; padding: 10px 14px; }
  table { width: 100%; border-collapse: collapse; } th, td { text-align: left; padding: 5px 4px; border-bottom: 1px solid #e7e5e4; }
  footer { margin-top: 28px; font-size: 9pt; color: #78716c; }
</style></head>
<body>
  <h1>{{titulo}}</h1>
  <p class="sub">{{subtitulo}} · {{fecha}}</p>
  <div class="resumen">{{resumen}}</div>
  <!-- repetir por sección -->
  <h2>{{seccion}}</h2>
  <p>{{contenido}}</p>
  <footer>{{pie}}</footer>
</body></html>
