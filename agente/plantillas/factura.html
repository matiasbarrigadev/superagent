<!doctype html>
<!-- Plantilla base de factura o presupuesto. El agente copia este archivo, reemplaza los {{campos}} y las filas,
     y lo pasa a PDF con: chromium --headless --no-sandbox --print-to-pdf=<salida>/factura.pdf factura.html -->
<html lang="es"><head><meta charset="utf-8"><title>{{titulo}}</title>
<style>
  @page { size: A4; margin: 18mm; }
  body { font-family: "DejaVu Sans", "Liberation Sans", sans-serif; color: #1c1917; font-size: 11pt; }
  header { display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 2px solid #047857; padding-bottom: 10px; }
  h1 { margin: 0; font-size: 20pt; color: #047857; }
  .meta { text-align: right; font-size: 10pt; line-height: 1.5; }
  .partes { display: flex; gap: 24px; margin: 18px 0; }
  .partes div { flex: 1; } .partes h2 { font-size: 9pt; text-transform: uppercase; color: #78716c; margin: 0 0 4px; }
  table { width: 100%; border-collapse: collapse; margin-top: 8px; }
  th { text-align: left; font-size: 9pt; text-transform: uppercase; color: #78716c; border-bottom: 1px solid #d6d3d1; padding: 6px 4px; }
  td { padding: 6px 4px; border-bottom: 1px solid #f5f5f4; } td.num, th.num { text-align: right; }
  .totales { margin-left: auto; width: 45%; margin-top: 12px; } .totales td { border: 0; } .total td { font-weight: bold; font-size: 13pt; border-top: 2px solid #1c1917; }
  footer { margin-top: 28px; font-size: 9pt; color: #78716c; }
</style></head>
<body>
  <header>
    <div><h1>{{titulo}}</h1><div>{{emisor_nombre}}<br>{{emisor_datos}}</div></div>
    <div class="meta">N.º {{numero}}<br>Fecha: {{fecha}}<br>{{vencimiento}}</div>
  </header>
  <section class="partes"><div><h2>Para</h2>{{cliente_nombre}}<br>{{cliente_datos}}</div></section>
  <table>
    <thead><tr><th>Descripción</th><th class="num">Cant.</th><th class="num">Precio</th><th class="num">Importe</th></tr></thead>
    <tbody>
      <!-- una fila por ítem -->
      <tr><td>{{item}}</td><td class="num">{{cantidad}}</td><td class="num">{{precio}}</td><td class="num">{{importe}}</td></tr>
    </tbody>
  </table>
  <table class="totales">
    <tr><td>Subtotal</td><td class="num">{{subtotal}}</td></tr>
    <tr><td>{{impuesto_nombre}}</td><td class="num">{{impuesto}}</td></tr>
    <tr class="total"><td>Total</td><td class="num">{{total}}</td></tr>
  </table>
  <footer>{{notas}}</footer>
</body></html>
