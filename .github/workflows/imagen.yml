# Publica la imagen de Superagent en GitHub Container Registry (pública), para amd64 y arm64.
#   - cada tag vX.Y.Z → ghcr.io/<dueño>/superagent:X.Y.Z, :X.Y y :latest  (lo que conviene usar)
#   - cada push a main → :edge                                             (lo último, sin versión)
name: Imagen

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGEN: ghcr.io/${{ github.repository_owner }}/superagent

jobs:
  pruebas:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test

  construir:
    needs: pruebas
    strategy:
      fail-fast: true
      matrix:
        include:
          - plataforma: linux/amd64
            runner: ubuntu-24.04
          - plataforma: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Nombre de la imagen en minúsculas
        run: echo "IMAGEN=${IMAGEN,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.plataforma }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.description=Superagente en WhatsApp: Claude Code detrás de un gateway con roles, para WhatsApp.
          outputs: type=image,name=${{ env.IMAGEN }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.plataforma }}
          cache-to: type=gha,mode=max,scope=${{ matrix.plataforma }}
      - name: Guardar el digest
        run: |
          mkdir -p /tmp/digests
          d="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${d#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ strategy.job-index }}
          path: /tmp/digests/*
          retention-days: 1

  publicar:
    needs: construir
    runs-on: ubuntu-24.04
    steps:
      - name: Nombre de la imagen en minúsculas
        run: echo "IMAGEN=${IMAGEN,,}" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGEN }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
      - name: Juntar las dos arquitecturas en un manifiesto
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGEN }}@sha256:%s ' *)
      - run: docker buildx imagetools inspect ${{ env.IMAGEN }}:${{ steps.meta.outputs.version }}
